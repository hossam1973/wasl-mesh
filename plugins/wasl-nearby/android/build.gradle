ext {
    playServicesNearbyVersion = project.hasProperty('playServicesNearbyVersion') ? rootProject.ext.playServicesNearbyVersion : '19.3.0'
}

buildscript {
    repositories { google(); mavenCentral() }
    dependencies { classpath 'com.android.tools.build:gradle:8.2.1' }
}

apply plugin: 'com.android.library'

android {
    namespace "com.wasl.nearby"
    compileSdk project.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 34
    defaultConfig {
        minSdkVersion project.hasProperty('minSdkVersion') ? rootProject.ext.minSdkVersion : 22
        targetSdkVersion project.hasProperty('targetSdkVersion') ? rootProject.ext.targetSdkVersion : 34
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lintOptions { abortOnError false }
}

repositories { google(); mavenCentral() }

dependencies {
    implementation project(":capacitor-android")
    implementation "androidx.core:core:1.12.0"
    implementation "com.google.android.gms:play-services-nearby:$playServicesNearbyVersion"
}
