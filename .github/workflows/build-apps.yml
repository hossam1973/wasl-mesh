name: Build Android & iOS apps

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write          # publish the APK as a direct download
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - run: mv android/app/build/outputs/apk/debug/app-debug.apk wasl-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: wasl-android-apk
          path: wasl-android.apk
      - name: Package the web platform
        run: cd app && zip -qr ../wasl-web.zip .
      - name: Publish direct downloads (release "latest")
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest wasl-android.apk wasl-web.zip \
            --title "وصل — أحدث نسخة" \
            --notes "نسخة تجريبية للاختبار الميداني. ثبّت wasl-android.apk مباشرة على Android (اسمح بالتثبيت من مصادر غير معروفة). wasl-web.zip يحوي منصة الويب كاملة. البناء: ${{ github.sha }}" \
            --target ${{ github.sha }} --latest

  ios:
    name: iOS (simulator build, unsigned)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx cap sync ios
      - name: Build for iOS Simulator
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tail -n 40
          test -d build/Build/Products/Debug-iphonesimulator/App.app
      - run: cd build/Build/Products/Debug-iphonesimulator && zip -qry ../../../../wasl-ios-simulator.zip App.app
      - uses: actions/upload-artifact@v4
        with:
          name: wasl-ios-simulator-app
          path: wasl-ios-simulator.zip
